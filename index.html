<style>
:root{--navy:#1F4E79;--navy2:#2c6aa0;--red:#C00000;--green:#1a7a3c;--bg:#eef2f7;--line:#dfe6ef;--mut:#6b7a8d}
*{box-sizing:border-box;font-family:'Segoe UI',system-ui,Arial,sans-serif}
body{margin:0;background:var(--bg);color:#1c2733;font-size:13.5px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font-size:13.5px}
.hidden{display:none!important}
input,select,textarea{font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;width:100%;background:#fff}
label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin:9px 0 4px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1F4E79,#15314d)}
.card{background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.2);padding:28px;width:340px}
.brand{font-weight:800;color:var(--navy);font-size:22px;letter-spacing:.5px}
.sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.btn{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-weight:600;font-size:13.5px}
.btn:hover{background:var(--navy2)}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.red{background:var(--red)}.btn.gray{background:#5b6b7d}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
#app{display:none;min-height:100vh}
header{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
header .t{font-weight:700;font-size:15px}
.syncb{margin-left:auto;font-size:12px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px;cursor:pointer;white-space:nowrap}
header .who{font-size:12px;opacity:.9;white-space:nowrap;max-width:30vw;overflow:hidden;text-overflow:ellipsis}
nav{display:flex;gap:4px;background:#fff;padding:5px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:calc(44px + env(safe-area-inset-top));z-index:40}
nav button{border:none;background:transparent;padding:9px 14px;border-radius:9px;color:var(--mut);font-weight:600;white-space:nowrap;font-size:13.5px}
nav button.on{background:var(--navy);color:#fff}
main{padding:14px;padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right));max-width:1100px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.grid{display:grid;gap:12px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;box-shadow:0 2px 8px rgba(31,78,121,.06)}
.fcard .nm{font-size:12px;color:var(--mut);font-weight:600}
.fcard .bal{font-size:20px;font-weight:800;margin-top:4px}
.fcard.total{background:var(--navy);color:#fff;border:none}
.fcard.total .nm{color:#cfe0f2}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
th{background:var(--navy);color:#fff;padding:8px 8px;text-align:left;position:sticky;top:0;font-size:12.5px}
td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:#f7f9fc}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:62vh}
.num{text-align:right;font-variant-numeric:tabular-nums}
.thu{color:var(--green);font-weight:600}.chi{color:var(--red);font-weight:600}
.pill{display:inline-block;background:#eaf1f9;color:var(--navy);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:28px;box-shadow:0 8px 24px rgba(192,0,0,.4);z-index:60}
.modal{position:fixed;inset:0;background:rgba(15,30,50,.55);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 6px;color:var(--navy)}
.iconbtn{border:none;background:transparent;font-size:17px;padding:5px 7px;border-radius:7px}
.iconbtn:hover{background:#eef2f7}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.toolbar>div{flex:1;min-width:120px}
.muted{color:var(--mut);font-size:12px}
.tag{font-size:11px;color:#fff;background:var(--mut);border-radius:6px;padding:1px 6px}
.tag.ct{background:#2c6aa0}.tag.vp{background:#7a5b1a}
.photo-prev{max-width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--line)}
.cbx{position:relative}
.cbx-pop{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(15,30,50,.16);max-height:240px;overflow:auto;z-index:130;display:none}
.cbx-pop.on{display:block}
.cbx-opt{padding:9px 11px;border-bottom:1px solid #eef2f7;cursor:pointer;font-size:14px}
.cbx-opt:active,.cbx-opt:hover{background:#eef4fb}
.cbx-add{color:var(--navy);font-weight:700}
.cbx-empty{padding:12px 13px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:30px}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.kpi .b{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex:1;min-width:110px}
.kpi .b .l{font-size:11px;color:var(--mut);font-weight:600}.kpi .b .v{font-size:17px;font-weight:800}
.notice{background:#fff7e6;border:1px solid #ffe2a8;color:#7a5b1a;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:12px}
.cap-row{display:flex;gap:8px}.cap-row label.btn{flex:1;text-align:center;display:block;margin:0}
.sec{font-weight:700;color:var(--navy);margin:13px 0 7px;font-size:14px}
.cat4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
@media(max-width:1000px){.cat4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.cat4{grid-template-columns:1fr}}
.hintbar{font-size:12.5px;color:var(--mut);margin:2px 0 8px}
:root[data-fs="sm"] body{zoom:.88}
:root[data-fs="lg"] body{zoom:1.15}
.fsbtn{font-weight:700}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .thx{position:absolute;top:2px;right:2px;background:rgba(192,0,0,.92);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;cursor:pointer}
.thumb-add{display:flex;align-items:center;padding:0 10px;font-size:12px;border:1px dashed var(--line);border-radius:8px}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="brand">TAPACO VIỆT NAM</div>
    <div class="sub">Hệ thống Quản lý Quỹ</div>
    <label>Tài khoản</label><input id="lg-user" placeholder="admin / ketoan / mã công trường" onkeydown="if(event.key==='Enter')doLogin()">
    <label>Mật khẩu</label><input id="lg-pass" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="lg-err" class="muted" style="color:#C00000;margin-top:8px"></div>
    <button class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">Đăng nhập</button>
    <div class="muted" style="margin-top:12px;line-height:1.5">Mặc định: <b>admin/admin123</b>, <b>ketoan/ketoan123</b>.<br>Công trường: <b>ct01/ct01</b>.</div>
  </div>
</div>

<div id="app">
  <header>
    <span class="t">TAPACO • Quỹ</span>
    <span class="syncb" id="syncbadge" onclick="syncNow()">●</span>
    <span class="who" id="whoami"></span>
    <button class="btn sm alt fsbtn" id="fsBtn" title="Đổi cỡ chữ" onclick="cycleFontSize()">A Vừa</button><button class="btn sm" id="installBtn" style="display:none" onclick="doInstall()">📲 Cài app</button>
    <button class="btn sm gray" onclick="logout()">Thoát</button>
  </header>
  <nav id="nav"></nav>
  <main id="view"></main>
  <button class="fab" id="fab" onclick="openTxn()">+</button>
</div>

<script>
const KEY='tapaco_quy_v1';
const DEFAULT_SYNC_URL='https://script.google.com/macros/s/AKfycbyVC3plr0sYLQa8BsXt3Rvo5Qd4T2N_DryEczEsmeo546WB-Se2-H26M3hanjXL7OX5/exec';
const OLD_SYNC_URLS=['https://script.google.com/macros/s/AKfycbyBtIdf_6YaakGLYAz1xkVvnXJtJKFNX6ywgdDdo6lnsbCI25AEumkCmRQRfUCEMgukyA/exec'];
// Nơi chứa file app.txt (chỉ chứa URL Apps Script /exec). Để trống = đọc file app.txt đặt CẠNH app (cùng thư mục index.html).
// Link GitHub raw của app.txt (đọc được mọi nơi nhờ CORS *). Đổi URL sau này: chỉ sửa nội dung file này trên GitHub.
const APPTXT_URL='https://raw.githubusercontent.com/vuhuylong1976-maker/tapaco-quy/refs/heads/main/app.txt';
const APPTXT_ALT=[];   // (để trống) — Drive không dùng được vì trình duyệt chặn CORS
// Mở app sẽ đọc URL mới nhất từ app.txt (nếu có) để khỏi phải sửa app trên từng máy khi đổi URL triển khai.
async function fetchSyncUrlFromFile(){
  const srcs=[]; if(APPTXT_URL)srcs.push(APPTXT_URL); if(typeof APPTXT_ALT!=='undefined')APPTXT_ALT.forEach(u=>srcs.push(u)); srcs.push('./app.txt'); srcs.push('app.txt');
  for(const u of srcs){
    try{
      const r=await fetch(u+(u.indexOf('?')>=0?'&':'?')+'_t='+Date.now(),{cache:'no-store'});
      if(!r||!r.ok)continue;
      const txt=await r.text();
      const m=txt.match(/https:\/\/script\.google\.com\/macros\/s\/[^\s"'<>]+\/exec/);
      if(m)return m[0];
    }catch(e){}
  }
  return '';
}
async function applySyncUrlFromFile(){
  const u=await fetchSyncUrlFromFile();
  if(u&&u!==DB.syncUrl){ DB.syncUrl=u; try{await Store.set(KEY,JSON.stringify(DB));}catch(e){} if(typeof updateSyncBadge==='function')updateSyncBadge(); }
}
const hasWS = typeof window!=='undefined' && window.storage && window.storage.get;
const Store={
  async get(k){ if(hasWS){try{const r=await window.storage.get(k,true);return r?r.value:null;}catch(e){return null;}} return localStorage.getItem(k); },
  async set(k,v){ if(hasWS){try{await window.storage.set(k,v,true);}catch(e){console.warn(e);}} else localStorage.setItem(k,v); },
  async del(k){ if(hasWS){try{await window.storage.delete(k,true);}catch(e){}} else localStorage.removeItem(k); }
};

let DB=null, ME=null, chart=null, photoList=[], editingId=null;
let dirty=false, lastSync=null, syncing=false, syncTimer=null;

const fmt=n=>(Number(n)||0).toLocaleString('vi-VN');
const today=()=>new Date().toISOString().slice(0,10);
const curYM=()=>new Date().toISOString().slice(0,7);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parseMoney=s=>Number(String(s==null?'':s).replace(/[^\d]/g,''))||0;
function fmtInput(el){const d=el.value.replace(/[^\d]/g,'');el.value=d?Number(d).toLocaleString('vi-VN'):'';}
function attachMoney(el){if(!el)return;el.setAttribute('inputmode','numeric');el.addEventListener('input',()=>fmtInput(el));fmtInput(el);}
const modalOpen=()=>!!document.getElementById('modal');

function seed(){return{
  syncUrl:DEFAULT_SYNC_URL, deleted:[],
  sites:[{code:'VP',name:'Văn phòng Công ty',type:'vp'},{code:'CT01',name:'Công trường 01',type:'ct'},{code:'CT02',name:'Công trường 02',type:'ct'}],
  opening:{VP:0,CT01:0,CT02:0},
  dauMuc:['Thi công móng','Thi công thân','Hoàn thiện','Hạ tầng kỹ thuật','San nền','Quản lý chung'],
  khoanMuc:['Tạm ứng','Hoàn ứng','Chi phí vật tư','Chi phí nhân công','Chi phí máy thi công','Chi phí thầu phụ','Lương & phụ cấp','Chi phí quản lý','Chi phí vận chuyển','Thuế & lệ phí','Trả nợ vay','Thu vốn / Thanh toán','Chi phí khác'],
  doiTuong:['Nhà cung cấp vật tư','Thầu phụ thi công','Cán bộ nhân viên','Nhà cung cấp xăng dầu','Đơn vị vận chuyển','Cơ quan thuế','Ngân hàng','Chủ đầu tư','Khác'],
  donVi:['Quỹ tiền mặt','TK Vietcombank','TK BIDV','TK Vietinbank'],
  rules:[
    {id:'r_cash20',label:'Chi tiền mặt ≥ 20 triệu phải chuyển khoản',applyTo:'all',match:'',cmp:'>=',limit:20000000,mode:'warn',msg:'Theo quy định thuế, khoản chi từ 20 triệu đồng trở lên phải thanh toán không dùng tiền mặt (chuyển khoản) mới được khấu trừ thuế GTGT và tính là chi phí hợp lệ.'},
    {id:'r_luong5',label:'Chi lương tiền mặt > 5 triệu',applyTo:'khoanMuc',match:'Lương & phụ cấp',cmp:'>',limit:5000000,mode:'warn',msg:'Khoản chi lương bằng tiền mặt vượt 5 triệu — cân nhắc chuyển khoản theo quy định nội bộ / thuế TNCN.'}
  ],
  users:[{u:'admin',p:'admin123',role:'admin',site:null,name:'Quản trị viên'},{u:'ketoan',p:'ketoan123',role:'ketoan',site:null,name:'Kế toán Công ty'},{u:'ct01',p:'ct01',role:'congtrinh',site:'CT01',name:'Phụ trách CT01'},{u:'ct02',p:'ct02',role:'congtrinh',site:'CT02',name:'Phụ trách CT02'}],
  txns:[]
};}

async function loadDB(){
  const raw=await Store.get(KEY);
  if(raw){try{DB=JSON.parse(raw);}catch(e){DB=seed();}}else{DB=seed();await Store.set(KEY,JSON.stringify(DB));}
  const s=seed(); Object.keys(s).forEach(k=>{if(DB[k]===undefined)DB[k]=s[k];});
  if(!DB.opening)DB.opening={}; if(!DB.deleted)DB.deleted=[];
  if(!DB.syncUrl||OLD_SYNC_URLS.indexOf(DB.syncUrl)>=0)DB.syncUrl=DEFAULT_SYNC_URL;
}
async function saveDB(){ await Store.set(KEY,JSON.stringify(DB)); markDirty(); }

/* ===== ĐỒNG BỘ 2 CHIỀU GOOGLE SHEET ===== */
function adoptServer(s){
  if(!s)return;
  const url=DB.syncUrl;
  DB=s; DB.syncUrl=url;
  const sd=seed(); Object.keys(sd).forEach(k=>{if(DB[k]===undefined)DB[k]=sd[k];});
  if(!DB.deleted)DB.deleted=[]; if(!DB.opening)DB.opening={};
  Store.set(KEY,JSON.stringify(DB));
}
function updateSyncBadge(){
  const el=document.getElementById('syncbadge'); if(!el)return;
  if(!DB.syncUrl){el.textContent='● Lưu nội bộ';el.title='Chưa nối Google Sheet (Tài khoản → Cài đặt đồng bộ)';return;}
  if(syncing){el.textContent='⟳ Đang đồng bộ…';return;}
  if(dirty){el.textContent='● Chờ đồng bộ';return;}
  el.textContent='✓ Đồng bộ '+(lastSync?lastSync.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'');
}
function markDirty(){dirty=true;updateSyncBadge();}
function syncNow(){cloudPush(true);}
async function cloudPull(manual){
  if(!DB.syncUrl||syncing)return;
  syncing=true;updateSyncBadge();
  try{
    const r=await fetch(DB.syncUrl,{method:'GET'});
    const j=await r.json();
    if(j&&j.ok&&j.data){applyServerData(j.data);dirty=false;lastSync=new Date();}
  }catch(e){if(manual)alert('Không tải được dữ liệu từ Google Sheet. Kiểm tra URL/kết nối.\n(Lưu ý: đồng bộ chạy được khi mở app trên trình duyệt thật, không chạy trong khung xem trước.)');}
  syncing=false;updateSyncBadge();
  if(ME&&!modalOpen())render();
}
async function cloudPush(manual){
  if(!DB.syncUrl){if(manual)alert('Chưa cấu hình địa chỉ Google Sheet.\nVào tab "Tài khoản" → "Cài đặt đồng bộ" để dán URL Web App.');return false;}
  if(syncing)return false;
  syncing=true;updateSyncBadge();
  let ok=false;
  try{
    const r=await fetch(DB.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'sync',role:ME?ME.role:'',ts:Date.now(),data:DB})});
    const j=await r.json();
    if(j&&j.ok&&j.data)adoptServer(j.data);
    dirty=false;lastSync=new Date();ok=true;
    if(manual)setTimeout(()=>alert('Đã đồng bộ với Google Sheet.'),50);
  }catch(e){if(manual)alert('Không đồng bộ được. Kiểm tra URL/kết nối.\n(Đồng bộ chạy được khi mở app trên trình duyệt thật.)');}
  syncing=false;updateSyncBadge();
  if(ME&&!modalOpen())render();
  return ok;
}
async function syncCycle(){
  if(!DB.syncUrl||syncing||modalOpen())return;
  if(dirty) await cloudPush(false); else await cloudPull(false);
  await flushPendingPhotos();
}

function applyServerData(data){
  if(data&&Array.isArray(data.txns)) adoptServer(data);
  else if(data&&Array.isArray(data.users)){ DB.users=data.users; Store.set(KEY,JSON.stringify(DB)); }
}
async function doLogin(){
  const u=document.getElementById('lg-user').value.trim().toLowerCase();
  const p=document.getElementById('lg-pass').value;
  const err=document.getElementById('lg-err');
  if(!u){err.textContent='Nhập tài khoản';return;}
  // Lấy danh sách tài khoản mới nhất từ Google Sheet rồi mới kiểm tra
  let online=false;
  if(DB.syncUrl){
    err.style.color='#6b7a8d'; err.textContent='Đang kiểm tra tài khoản trên Google Sheet…';
    try{ const r=await fetch(DB.syncUrl,{method:'GET'}); const j=await r.json(); if(j&&j.ok&&j.data){applyServerData(j.data);online=true;} }
    catch(e){ /* mất mạng: dùng danh sách đã lưu trên máy */ }
    err.style.color='#C00000';
  }
  const f=DB.users.find(x=>x.u.toLowerCase()===u&&x.p===p);
  if(!f){err.textContent='Sai tài khoản hoặc mật khẩu.'+(DB.syncUrl&&!online?' (Không kết nối được Google Sheet — đang kiểm tra theo dữ liệu đã lưu trên máy.)':'');return;}
  ME=f; err.textContent='';
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoami').textContent=ME.name+' ('+roleLabel(ME.role)+(ME.site?(' • '+ME.site):'')+')';
  buildNav(); go('dash'); updateSyncBadge();
  if(DB.syncUrl) cloudPull(false);
  if(syncTimer)clearInterval(syncTimer);
  syncTimer=setInterval(syncCycle,60000);
}
function logout(){ME=null;location.reload();}
function roleLabel(r){return {admin:'Admin',ketoan:'Kế toán',congtrinh:'Công trình',vanphong:'Văn phòng',site:'Công trình'}[r]||r;}
function deptName(u){ if(!u)return '—'; if(u.role==='admin'||u.role==='ketoan')return 'Công ty'; const s=DB.sites.find(x=>x.code===u.site); return s?(s.name+' ('+s.code+')'):(u.site||'—'); }
const canSeeAll=()=>ME&&(ME.role==='admin'||ME.role==='ketoan');
const canManage=()=>ME&&(ME.role==='admin'||ME.role==='ketoan');   // sửa danh mục + quản lý tài khoản
const isAdmin=()=>ME&&ME.role==='admin';                            // riêng admin được sửa link URL Apps Script
const canOpenMaster=()=>!!ME;                                        // mọi tài khoản đều được xem Danh mục
const canEditMaster=()=>ME&&(ME.role==='admin'||ME.role==='ketoan');// chỉ admin/kế toán được sửa Danh mục
function isSiteBound(u){const r=(u||ME).role;return r==='congtrinh'||r==='vanphong'||r==='site';}
function visibleSites(){return canSeeAll()?DB.sites:DB.sites.filter(s=>s.code===ME.site);}
function canEditTxn(t){return canSeeAll()||(isSiteBound(ME)&&t.site===ME.site);}

let VIEW='dash';
function buildNav(){
  const items=[['dash','Tổng quan'],['ledger','Sổ quỹ'],['report','Báo cáo']];
  if(canOpenMaster())items.push(['master','Danh mục']);
  if(canManage())items.push(['users','Tài khoản']);
  document.getElementById('nav').innerHTML=items.map(([k,l])=>`<button class="${k===VIEW?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
}
function go(v){VIEW=v;buildNav();render();}
function render(){
  if(!ME)return;
  document.getElementById('fab').style.display=(VIEW==='ledger'||VIEW==='dash')?'block':'none';
  if(VIEW==='dash')return renderDash();
  if(VIEW==='ledger')return renderLedger();
  if(VIEW==='report')return renderReport();
  if(VIEW==='master')return renderMaster();
  if(VIEW==='users')return renderUsers();
}

function closeModal(){const m=document.getElementById('modal');if(m)m.remove();}
function openForm(o){
  const inner=o.fields.map(f=>{
    if(f.type==='select'){
      const opts=(f.options||[]).map(op=>{const v=typeof op==='object'?op.v:op;const l=typeof op==='object'?op.l:op;return `<option value="${esc(v)}" ${String(f.value)===String(v)?'selected':''}>${esc(l)}</option>`;}).join('');
      return `<label>${esc(f.label)}</label><select id="ff-${f.key}" ${f.readonly?'disabled':''}>${opts}</select>`;
    }
    if(f.type==='textarea')return `<label>${esc(f.label)}</label><textarea id="ff-${f.key}" rows="2">${esc(f.value||'')}</textarea>`;
    const t=f.type==='password'?'password':'text';
    return `<label>${esc(f.label)}</label><input id="ff-${f.key}" type="${t}" value="${esc(f.value==null?'':f.value)}" placeholder="${esc(f.placeholder||'')}" ${f.readonly?'readonly':''}>`;
  }).join('');
  document.body.insertAdjacentHTML('beforeend',
    `<div class="modal" id="modal"><div class="sheet"><h3>${esc(o.title)}</h3>${o.subtitle?`<div class="muted" style="margin-bottom:6px">${esc(o.subtitle)}</div>`:''}${inner}<div style="display:flex;gap:8px;margin-top:18px"><button class="btn" style="flex:1" id="ff-save">${esc(o.saveLabel||'Lưu')}</button><button class="btn gray" onclick="closeModal()">Hủy</button></div></div></div>`);
  o.fields.forEach(f=>{if(f.money)attachMoney(document.getElementById('ff-'+f.key));});
  document.getElementById('ff-save').onclick=()=>{
    const vals={};
    o.fields.forEach(f=>{const el=document.getElementById('ff-'+f.key);let val=el.value;if(f.money)val=parseMoney(val);else if(typeof val==='string')val=val.trim();vals[f.key]=val;});
    o.onSave(vals);
  };
}

function balanceOf(code){let b=Number(DB.opening[code]||0);DB.txns.forEach(t=>{if(t.site===code)b+=t.type==='thu'?Number(t.amount):-Number(t.amount);});return b;}
function totalCompany(){return DB.sites.reduce((s,x)=>s+balanceOf(x.code),0);}

function renderDash(){
  const sites=visibleSites();
  const cards=sites.map(s=>{const b=balanceOf(s.code);return `<div class="fcard"><div class="nm"><span class="tag ${s.type}">${s.type==='vp'?'VP':'CT'}</span> ${esc(s.name)} <span class="muted">(${s.code})</span></div><div class="bal" style="color:${b<0?'#C00000':'#1F4E79'}">${fmt(b)} đ</div></div>`;}).join('');
  const totalCard=canSeeAll()?`<div class="fcard total"><div class="nm">QUỸ TỔNG TOÀN CÔNG TY (Công trường + VP)</div><div class="bal">${fmt(totalCompany())} đ</div></div>`:'';
  const ym=curYM();
  const scope=DB.txns.filter(t=>canSeeAll()||t.site===ME.site);
  const m=scope.filter(t=>t.date&&t.date.slice(0,7)===ym);
  const thu=m.filter(t=>t.type==='thu').reduce((s,t)=>s+Number(t.amount),0);
  const chi=m.filter(t=>t.type==='chi').reduce((s,t)=>s+Number(t.amount),0);
  const recent=[...scope].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.createdAt-a.createdAt).slice(0,8);
  document.getElementById('view').innerHTML=`${totalCard}<div class="kpi"><div class="b"><div class="l">Thu tháng này</div><div class="v thu">${fmt(thu)}</div></div><div class="b"><div class="l">Chi tháng này</div><div class="v chi">${fmt(chi)}</div></div><div class="b"><div class="l">Chênh lệch</div><div class="v">${fmt(thu-chi)}</div></div></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">${cards}</div><h3 class="sec">Giao dịch gần đây</h3><div class="tbl-wrap"><table><thead><tr><th>Ngày</th><th>Số CT</th><th>Quỹ</th><th>Diễn giải</th><th class="num">Thu</th><th class="num">Chi</th></tr></thead><tbody>${recent.length?recent.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.voucher||'')}</td><td><span class="pill">${esc(t.site)}</span></td><td>${esc(t.note||t.khoanMuc||'')}</td><td class="num thu">${t.type==='thu'?fmt(t.amount):''}</td><td class="num chi">${t.type==='chi'?fmt(t.amount):''}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Chưa có giao dịch</td></tr>'}</tbody></table></div>`;
}

let ledgerSite='';let ledgerSearch='';let ledgerSort={key:'date',dir:'desc'};
function renderLedger(){
  const sites=visibleSites();
  if(!ledgerSite||!sites.find(s=>s.code===ledgerSite))ledgerSite=sites[0]?sites[0].code:'';
  const opts=sites.map(s=>`<option value="${s.code}" ${s.code===ledgerSite?'selected':''}>${esc(s.name)} (${s.code})</option>`).join('');
  const all=DB.txns.filter(t=>t.site===ledgerSite);
  const thu=all.filter(t=>t.type==='thu').reduce((s,t)=>s+Number(t.amount),0);
  const chi=all.filter(t=>t.type==='chi').reduce((s,t)=>s+Number(t.amount),0);
  const opening=Number(DB.opening[ledgerSite]||0);
  document.getElementById('view').innerHTML=`<div class="toolbar"><div><label>Chọn quỹ</label><select onchange="ledgerSite=this.value;ledgerSearch='';renderLedger()">${opts}</select></div><div style="flex:2;min-width:200px"><label>Tìm theo đối tượng / diễn giải</label><input id="ledgerSearchBox" value="${esc(ledgerSearch)}" placeholder="Tìm: tên đối tượng / diễn giải / khoản mục…" oninput="ledgerSearch=this.value;fillLedgerRows()"></div><div style="flex:0"><label>&nbsp;</label><button class="btn sm" onclick="exportLedgerXlsx()">⬇ Excel</button></div><div style="flex:0"><label>&nbsp;</label><button class="btn sm gray" onclick="printLedger()">🖨 PDF</button></div><div style="flex:0"><label>&nbsp;</label><button class="btn sm alt" id="pushPhotoBtn" onclick="pushAllPhotos()">☁ Đẩy ảnh lên Drive</button></div></div><div class="kpi"><div class="b"><div class="l">Tổng Thu</div><div class="v thu">${fmt(thu)}</div></div><div class="b"><div class="l">Tổng Chi</div><div class="v chi">${fmt(chi)}</div></div><div class="b"><div class="l">Tồn quỹ hiện tại</div><div class="v">${fmt(balanceOf(ledgerSite))}</div></div><div class="b"><div class="l">Tồn đầu kỳ</div><div class="v">${fmt(opening)}</div></div></div><div class="hintbar">Bấm tiêu đề <b>Ngày</b>, <b>Diễn giải</b>, <b>Thu</b>, <b>Chi</b> để sắp xếp. Mặc định: ngày mới nhất ở trên.</div><div class="tbl-wrap" id="ledgerTbl"><table><thead><tr>${ledgerHead()}</tr></thead><tbody id="ledgerBody"></tbody></table></div>`;
  fillLedgerRows();
  countLocalPhotosToPush().then(n=>{const b=document.getElementById('pushPhotoBtn');if(b)b.textContent=n>0?('☁ Đẩy '+n+' ảnh lên Drive'):'☁ Ảnh đã lên Drive';});
}
function ledgerHead(){
  const ar=k=>ledgerSort.key===k?(ledgerSort.dir==='asc'?' ▲':' ▼'):'';
  const sc='cursor:pointer;user-select:none;white-space:nowrap';
  return `<th>#</th><th style="${sc}" onclick="ledgerSortBy('date')">Ngày / Số CT${ar('date')}</th><th style="${sc}" onclick="ledgerSortBy('note')">Diễn giải${ar('note')}</th><th>Đối tượng</th><th>Khoản mục</th><th class="num" style="${sc}" onclick="ledgerSortBy('thu')">Thu${ar('thu')}</th><th class="num" style="${sc}" onclick="ledgerSortBy('chi')">Chi${ar('chi')}</th><th class="num">Tồn</th><th></th>`;
}
function ledgerSortBy(k){ if(ledgerSort.key===k){ledgerSort.dir=ledgerSort.dir==='asc'?'desc':'asc';}else{ledgerSort.key=k;ledgerSort.dir=(k==='note')?'asc':'desc';} renderLedger(); }
function fillLedgerRows(){
  const bodyEl=document.getElementById('ledgerBody'); if(!bodyEl)return;
  const chrono=DB.txns.filter(t=>t.site===ledgerSite).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||0)-(b.createdAt||0));
  let run=Number(DB.opening[ledgerSite]||0); const runMap={},sttMap={};
  chrono.forEach((t,i)=>{run+=t.type==='thu'?Number(t.amount):-Number(t.amount);runMap[t.id]=run;sttMap[t.id]=i+1;});
  const q=(ledgerSearch||'').trim().toLowerCase();
  let rows=chrono.filter(t=>!q||(t.doiTuong||'').toLowerCase().indexOf(q)>=0||(t.note||'').toLowerCase().indexOf(q)>=0||(t.khoanMuc||'').toLowerCase().indexOf(q)>=0);
  const dir=ledgerSort.dir==='asc'?1:-1,k=ledgerSort.key;
  rows.sort((a,b)=>{
    if(k==='date'){const va=(a.date||'')+' '+String(a.createdAt||0),vb=(b.date||'')+' '+String(b.createdAt||0);return va<vb?-dir:va>vb?dir:0;}
    if(k==='note'){const va=(a.note||'').toLowerCase(),vb=(b.note||'').toLowerCase();return va<vb?-dir:va>vb?dir:0;}
    if(k==='thu'){return ((a.type==='thu'?Number(a.amount):0)-(b.type==='thu'?Number(b.amount):0))*dir;}
    if(k==='chi'){return ((a.type==='chi'?Number(a.amount):0)-(b.type==='chi'?Number(b.amount):0))*dir;}
    return 0;
  });
  if(!rows.length){bodyEl.innerHTML=`<tr><td colspan="9" class="empty">${q?'Không tìm thấy giao dịch khớp':'Chưa có giao dịch'}</td></tr>`;return;}
  bodyEl.innerHTML=rows.map(t=>`<tr ondblclick="printVoucher('${t.id}')" title="Nháy đúp để in phiếu thu/chi"><td>${sttMap[t.id]}</td><td>${esc(t.date)}<div class="muted">${esc(t.voucher||'')}</div></td><td>${esc(t.note||'')}<div class="muted">${esc(t.dauMuc||'')}</div>${t.hasPhoto?` <button class="iconbtn" title="Xem ảnh" onclick="viewPhoto('${t.id}')">🖼️${photoCountOf(t)>1?('×'+photoCountOf(t)):''}</button>`:''}</td><td>${esc(t.doiTuong||'')}</td><td>${esc(t.khoanMuc||'')}</td><td class="num thu">${t.type==='thu'?fmt(t.amount):''}</td><td class="num chi">${t.type==='chi'?fmt(t.amount):''}</td><td class="num">${fmt(runMap[t.id])}</td><td style="white-space:nowrap"><button class="iconbtn" title="In phiếu" onclick="printVoucher('${t.id}')">🖨️</button>${canEditTxn(t)?`<button class="iconbtn" onclick="openTxn('${t.id}')">✏️</button><button class="iconbtn" onclick="delTxn('${t.id}')">🗑️</button>`:''}</td></tr>`).join('');
}

function suggestVoucher(site,type){
  const pre=(type==='thu'?'PT':'PC')+'-'+site+'-';
  let mx=0;
  DB.txns.forEach(t=>{if(t.site===site&&t.type===type&&t.voucher&&t.voucher.indexOf(pre)===0){const n=parseInt(t.voucher.slice(pre.length),10);if(!isNaN(n))mx=Math.max(mx,n);}});
  return pre+String(mx+1).padStart(3,'0');
}

argin-top:8px">Đã có ${photoCountOf(t)} ảnh — chụp/chọn ảnh mới sẽ <b>thay toàn bộ</b>.</div>`:''}<div id="photoPrev" class="thumbs"></div><div style="display:flex;gap:8px;margin-top:18px"><button class="btn" style="flex:1" onclick="saveTxn()">${id?'Lưu thay đổi':'Thêm'}</button><button class="btn gray" onclick="closeModal()">Hủy</button></div></div></div>`);

function onPhoto(inp){
  const files=Array.from(inp.files||[]); if(!files.length)return;
  files.forEach(f=>{ const r=new FileReader(); r.onload=e=>{const img=new Image();img.onload=()=>{const max=1000,sc=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=img.width*sc;cv.height=img.height*sc;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);photoList.push(cv.toDataURL('image/jpeg',0.6));renderThumbs();};img.src=e.target.result;}; r.readAsDataURL(f); });
  inp.value='';
}

/* ===== NGƯỠNG CẢNH BÁO CHI ===== */
function limitViolations(obj){
  const out=[]; if(!obj||obj.type!=='chi')return out;
  (DB.rules||[]).forEach(r=>{
    if(!r||!r.limit)return;
    let ap=false;
    if(r.applyTo==='all')ap=true;
    else if(r.applyTo==='khoanMuc')ap=(obj.khoanMuc===r.match);
    else if(r.applyTo==='dauMuc')ap=(obj.dauMuc===r.match);
    else if(r.applyTo==='doiTuong')ap=(obj.doiTuong===r.match);
    else if(r.applyTo==='site')ap=(obj.site===r.match);
    if(!ap)return;
    const over = r.cmp==='>' ? Number(obj.amount)>Number(r.limit) : Number(obj.amount)>=Number(r.limit);
    if(over)out.push(r);
  });
  return out;
}

function photoCountOf(t){ if(!t)return 0; if(t.photoCount!=null)return t.photoCount; return t.hasPhoto?1:0; }
function isPhotoUploaded(t){ return !!(t&&(t.photoUp===true||t.photoFile)); }
async function getLocalPhotos(id){
  try{ const a=await Store.get('photos_'+id); if(a){ const arr=JSON.parse(a); if(Array.isArray(arr))return arr; } }catch(e){}
  const one=await Store.get('photo_'+id); return one?[one]:[];
}
async function setLocalPhotos(id,arr){
  try{ await Store.set('photos_'+id,JSON.stringify(arr)); }catch(e){}
  try{ await Store.set('photo_'+id,arr[0]||''); }catch(e){}
}
async function delLocalPhotos(id){ try{await Store.del('photos_'+id);}catch(e){} try{await Store.del('photo_'+id);}catch(e){} }
async function drivePhotosUpload(t,arr){
  if(!DB.syncUrl||!arr||!arr.length)return null;
  try{
    const r=await fetch(DB.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'photoUpload',rec:{id:t.id,voucher:t.voucher||'',site:t.site||''},dataUrls:arr})});
    const j=await r.json();
    if(j&&j.ok)return j;
  }catch(e){}
  return null;
}
async function drivePhotosFetch(t){
  if(!DB.syncUrl)return [];
  try{
    const q=DB.syncUrl+(DB.syncUrl.indexOf('?')>=0?'&':'?')+'action=photo&id='+encodeURIComponent(t.id)+'&voucher='+encodeURIComponent(t.voucher||'')+'&site='+encodeURIComponent(t.site||'');
    const r=await fetch(q,{method:'GET'});
    const j=await r.json();
    if(j&&j.ok){ if(Array.isArray(j.dataUrls)&&j.dataUrls.length)return j.dataUrls; if(j.dataUrl)return [j.dataUrl]; }
  }catch(e){}
  return [];
}
async function loadPhotos(t){
  let arr=await getLocalPhotos(t.id);
  if(arr&&arr.length)return arr;
  arr=await drivePhotosFetch(t);
  if(arr&&arr.length){ try{await setLocalPhotos(t.id,arr);}catch(e){} }
  return arr||[];
}
async function flushPendingPhotos(){
  if(!DB.syncUrl||!DB||!DB.txns)return;
  for(const t of DB.txns){
    if(t&&t.hasPhoto&&(t.photoPending||!isPhotoUploaded(t))){
      const arr=await getLocalPhotos(t.id);
      if(arr&&arr.length){ const info=await drivePhotosUpload(t,arr); if(info){t.photoPending=false;t.photoUp=true;t.photoCount=arr.length;await saveDB();} }
    }
  }
}
async function countLocalPhotosToPush(){
  if(!DB||!DB.txns)return 0; let n=0;
  for(const t of DB.txns){ if(t&&t.hasPhoto&&!isPhotoUploaded(t)){ const arr=await getLocalPhotos(t.id); if(arr&&arr.length)n++; } }
  return n;
}
async function pushAllPhotos(){
  if(!DB.syncUrl){alert('Chưa cài đặt địa chỉ đồng bộ Google Sheet nên không đẩy ảnh lên Drive được.');return;}
  const list=[];
  for(const t of DB.txns){ if(t&&t.hasPhoto){ const arr=await getLocalPhotos(t.id); if(arr&&arr.length)list.push({t,arr}); } }
  if(!list.length){alert('Máy này không có ảnh nào đang lưu để đẩy lên Drive.\n(Ảnh chỉ nằm trên chính máy đã chụp/nhập chứng từ đó.)');return;}
  const tot=list.reduce((s,x)=>s+x.arr.length,0);
  if(!confirm('Sẽ đẩy '+tot+' ảnh (của '+list.length+' chứng từ) lên Google Drive. Tiếp tục?'))return;
  const btn=document.getElementById('pushPhotoBtn'); const old=btn?btn.textContent:'';
  let ok=0,fail=0;
  for(let i=0;i<list.length;i++){
    if(btn)btn.textContent='Đang đẩy '+(i+1)+'/'+list.length+'…';
    const {t,arr}=list[i];
    const info=await drivePhotosUpload(t,arr);
    if(info){t.photoPending=false;t.photoUp=true;t.photoCount=arr.length;ok+=arr.length;}else{fail+=arr.length;}
  }
  await saveDB();
  if(btn)btn.textContent=old;
  alert('Xong. Đã đẩy lên Drive: '+ok+' ảnh.'+(fail?(' Lỗi/không đẩy được: '+fail+' (kiểm tra mạng rồi bấm lại).'):' Máy công ty giờ xem được các ảnh này.'));
  render();
}
async function drivePhotoDelete(t){if(!DB.syncUrl)return;try{await fetch(DB.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'photoDelete',rec:{id:t.id,voucher:t.voucher||'',site:t.site||''}})});}catch(e){}}

/* ===== BÁO CÁO ===== */
let rpt={mode:'month',month:curYM(),from:'',to:'',site:'',dauMuc:'',khoanMuc:'',doiTuong:'',group:'khoanMuc',q:''};
function filterLabel(){let a=[];if(rpt.site)a.push('Quỹ '+rpt.site);if(rpt.dauMuc)a.push('ĐM: '+rpt.dauMuc);if(rpt.khoanMuc)a.push('KM: '+rpt.khoanMuc);if(rpt.doiTuong)a.push('ĐT: '+rpt.doiTuong);return a.length?a.join(' | '):'Toàn bộ';}
function periodLabel(){return rpt.mode==='month'?('Tháng '+rpt.month.slice(5)+'/'+rpt.month.slice(0,4)):rpt.mode==='all'?'Toàn bộ thời gian':((rpt.from||'...')+' → '+(rpt.to||'...'));}
function renderReport(){
  const sites=visibleSites();
  if(rpt.site&&!sites.find(s=>s.code===rpt.site))rpt.site='';
  const siteOpts=`<option value="">— Tất cả quỹ ${canSeeAll()?'(toàn công ty)':''} —</option>`+sites.map(s=>`<option value="${s.code}" ${rpt.site===s.code?'selected':''}>${esc(s.name)} (${s.code})</option>`).join('');
  const gOpts=[['khoanMuc','Khoản mục chi'],['doiTuong','Đối tượng chi'],['site','Công trường / VP'],['dauMuc','Đầu mục việc']].map(([k,l])=>`<option value="${k}" ${rpt.group===k?'selected':''}>${l}</option>`).join('');
  const dmOpts='<option value="">— Tất cả đầu mục —</option>'+DB.dauMuc.map(x=>`<option ${rpt.dauMuc===x?'selected':''}>${esc(x)}</option>`).join('');
  const kmOpts='<option value="">— Tất cả khoản mục —</option>'+DB.khoanMuc.map(x=>`<option ${rpt.khoanMuc===x?'selected':''}>${esc(x)}</option>`).join('');
  const dtOpts='<option value="">— Tất cả đối tượng —</option>'+DB.doiTuong.map(x=>`<option ${rpt.doiTuong===x?'selected':''}>${esc(x)}</option>`).join('');
  const mOpts=[['month','Theo tháng'],['all','Toàn bộ'],['range','Khoảng ngày']].map(([k,l])=>`<option value="${k}" ${rpt.mode===k?'selected':''}>${l}</option>`).join('');
  let dateCtrl='';
  if(rpt.mode==='month')dateCtrl=`<div><label>Chọn tháng</label><input type="month" value="${rpt.month}" onchange="rpt.month=this.value;renderReport()"></div>`;
  else if(rpt.mode==='range')dateCtrl=`<div><label>Từ ngày</label><input type="date" value="${rpt.from}" onchange="rpt.from=this.value;renderReport()"></div><div><label>Đến ngày</label><input type="date" value="${rpt.to}" onchange="rpt.to=this.value;renderReport()"></div>`;
  document.getElementById('view').innerHTML=`<div class="toolbar"><div><label>Kỳ báo cáo</label><select onchange="rpt.mode=this.value;renderReport()">${mOpts}</select></div>${dateCtrl}<div><label>Công trình / Quỹ</label><select onchange="rpt.site=this.value;renderReport()">${siteOpts}</select></div><div><label>Lọc đầu mục việc</label><select onchange="rpt.dauMuc=this.value;renderReport()">${dmOpts}</select></div><div><label>Lọc khoản mục</label><select onchange="rpt.khoanMuc=this.value;renderReport()">${kmOpts}</select></div><div><label>Lọc đối tượng</label><select onchange="rpt.doiTuong=this.value;renderReport()">${dtOpts}</select></div><div><label>Nhóm theo</label><select onchange="rpt.group=this.value;renderReport()">${gOpts}</select></div></div><div class="toolbar" style="margin-top:-4px"><div style="flex:2;min-width:220px"><label>Tìm trong chi tiết (đối tượng / diễn giải / khoản mục)</label><input id="rptSearchBox" value="${esc(rpt.q||'')}" placeholder="Gõ để lọc bảng chi tiết…" oninput="rpt.q=this.value;fillReportDetail()"></div><div style="flex:0"><button class="btn sm" onclick="exportReportXlsx()">⬇ Excel</button></div><div style="flex:0"><button class="btn sm gray" onclick="printReport()">🖨 PDF</button></div></div><div id="rptBody"></div>`;
  drawReport();
  fillReportDetail();
}
function filterTxns(){
  const sites=visibleSites().map(s=>s.code);
  let d=DB.txns.filter(t=>sites.includes(t.site));
  if(rpt.site)d=d.filter(t=>t.site===rpt.site);
  if(rpt.dauMuc)d=d.filter(t=>t.dauMuc===rpt.dauMuc);
  if(rpt.khoanMuc)d=d.filter(t=>t.khoanMuc===rpt.khoanMuc);
  if(rpt.doiTuong)d=d.filter(t=>t.doiTuong===rpt.doiTuong);
  if(rpt.mode==='month')d=d.filter(t=>t.date&&t.date.slice(0,7)===rpt.month);
  else if(rpt.mode==='range'){if(rpt.from)d=d.filter(t=>t.date>=rpt.from);if(rpt.to)d=d.filter(t=>t.date<=rpt.to);}
  return d;
}
function reportRows(){
  const map={};
  filterTxns().forEach(t=>{let k=t[rpt.group]||'(Không phân loại)';if(rpt.group==='site'){const s=DB.sites.find(x=>x.code===t.site);k=s?`${s.name} (${s.code})`:t.site;}if(!map[k])map[k]={thu:0,chi:0};map[k][t.type]+=Number(t.amount);});
  return Object.entries(map).map(([k,v])=>({k,thu:v.thu,chi:v.chi,cl:v.thu-v.chi})).sort((a,b)=>(b.thu+b.chi)-(a.thu+a.chi));
}
function detailRows(){return filterTxns().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.voucher||'').localeCompare(b.voucher||''));}
function drawReport(){
  const rows=reportRows();
  const tThu=rows.reduce((s,r)=>s+r.thu,0),tChi=rows.reduce((s,r)=>s+r.chi,0);
  const gname={khoanMuc:'Khoản mục',doiTuong:'Đối tượng',site:'Công trường/VP',dauMuc:'Đầu mục việc'}[rpt.group];
  const det=detailRows();
  const detBody=det.length?det.map((t,i)=>`<tr ondblclick="printVoucher('${t.id}')" title="Nháy đúp để in phiếu"><td>${i+1}</td><td>${esc(t.date)}</td><td>${esc(t.voucher||'')}</td><td><span class="pill">${esc(t.site)}</span></td><td>${esc(t.dauMuc||'')}</td><td>${esc(t.khoanMuc||'')}</td><td>${esc(t.doiTuong||'')}</td><td>${esc(t.note||'')}</td><td class="num thu">${t.type==='thu'?fmt(t.amount):''}</td><td class="num chi">${t.type==='chi'?fmt(t.amount):''}</td></tr>`).join(''):'<tr><td colspan="10" class="empty">Không có giao dịch trong kỳ</td></tr>';
  document.getElementById('rptBody').innerHTML=`<div class="sec">Tổng hợp theo ${gname.toLowerCase()}</div><div class="tbl-wrap" style="max-height:none"><table id="rptTable"><thead><tr><th>${gname}</th><th class="num">Thu</th><th class="num">Chi</th><th class="num">Chênh lệch</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${esc(r.k)}</td><td class="num thu">${fmt(r.thu)}</td><td class="num chi">${fmt(r.chi)}</td><td class="num">${fmt(r.cl)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Không có dữ liệu</td></tr>'}</tbody><tfoot><tr><th>TỔNG CỘNG</th><th class="num">${fmt(tThu)}</th><th class="num">${fmt(tChi)}</th><th class="num">${fmt(tThu-tChi)}</th></tr></tfoot></table></div><div class="fcard" style="margin-top:14px"><canvas id="rptChart" height="120"></canvas></div><div class="sec">Chi tiết giao dịch</div><div class="muted" id="detCount" style="margin:2px 0 6px"></div><div class="tbl-wrap" id="detTable"><table><thead><tr><th>#</th><th>Ngày</th><th>Số CT</th><th>Quỹ</th><th>Đầu mục</th><th>Khoản mục</th><th>Đối tượng</th><th>Diễn giải</th><th class="num">Thu</th><th class="num">Chi</th></tr></thead><tbody id="rptDetBody">${detBody}</tbody></table></div>`;
  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('rptChart'),{type:'bar',data:{labels:rows.map(r=>r.k),datasets:[{label:'Thu',data:rows.map(r=>r.thu),backgroundColor:'#1a7a3c'},{label:'Chi',data:rows.map(r=>r.chi),backgroundColor:'#C00000'}]},options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y:{ticks:{callback:v=>fmt(v)}}}}});
}
// Lọc live bảng chi tiết báo cáo theo đối tượng / diễn giải / khoản mục
function fillReportDetail(){
  const body=document.getElementById('rptDetBody'); if(!body)return;
  const q=(rpt.q||'').trim().toLowerCase();
  let det=detailRows();
  if(q)det=det.filter(t=>(t.doiTuong||'').toLowerCase().indexOf(q)>=0||(t.note||'').toLowerCase().indexOf(q)>=0||(t.khoanMuc||'').toLowerCase().indexOf(q)>=0);
  body.innerHTML=det.length?det.map((t,i)=>`<tr ondblclick="printVoucher('${t.id}')" title="Nháy đúp để in phiếu"><td>${i+1}</td><td>${esc(t.date)}</td><td>${esc(t.voucher||'')}</td><td><span class="pill">${esc(t.site)}</span></td><td>${esc(t.dauMuc||'')}</td><td>${esc(t.khoanMuc||'')}</td><td>${esc(t.doiTuong||'')}</td><td>${esc(t.note||'')}</td><td class="num thu">${t.type==='thu'?fmt(t.amount):''}</td><td class="num chi">${t.type==='chi'?fmt(t.amount):''}</td></tr>`).join(''):`<tr><td colspan="10" class="empty">${q?'Không tìm thấy giao dịch khớp':'Không có giao dịch trong kỳ'}</td></tr>`;
  const c=document.getElementById('detCount'); if(c)c.textContent=det.length+' giao dịch'+(q?(' khớp "'+rpt.q+'"'):'');
}

/* ===== DANH MỤC ===== */
function renderMaster(){
  const canEd=canEditMaster();
  const acts=(key,title,i)=>canEd?`<button class="iconbtn" onclick="listForm('${key}','${title}',${i})">✏️</button><button class="iconbtn" onclick="rmItem('${key}',${i})">🗑️</button>`:'';
  const addBtn=(key,title)=>canEd?`<button class="btn sm" style="margin-left:auto" onclick="listForm('${key}','${title}')">+ Thêm</button>`:'';
  const block=(title,key)=>`<div class="fcard"><div style="display:flex;align-items:center;gap:8px"><b style="color:#1F4E79">${title}</b><span class="muted" style="font-size:12px;margin-left:3px">(${DB[key].length})</span>${addBtn(key,title)}</div><div style="margin-top:8px;max-height:360px;overflow:auto">${DB[key].map((x,i)=>`<div style="display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--line)"><span style="flex:1">${esc(x)}</span>${acts(key,title,i)}</div>`).join('')||'<div class="muted">Trống</div>'}</div></div>`;
  const siteActs=i=>canEd?`<button class="iconbtn" onclick="siteForm(${i})">✏️</button><button class="iconbtn" onclick="rmSite(${i})">🗑️</button>`:'';
  const siteRows=DB.sites.map((s,i)=>`<tr><td><span class="tag ${s.type}">${s.type==='vp'?'VP':'CT'}</span></td><td>${esc(s.code)}</td><td>${esc(s.name)}</td><td class="num">${fmt(DB.opening[s.code]||0)}</td><td>${siteActs(i)}</td></tr>`).join('');
  const addSite=canEd?`<button class="btn sm" style="margin-left:auto" onclick="siteForm(-1)">+ Thêm quỹ</button>`:'';
  const notice=canEd?`<div class="notice">Dữ liệu dùng chung qua Google Sheet. Sửa danh mục tại đây sẽ áp dụng cho ô chọn khi nhập liệu (admin/kế toán mới sửa được và mới đẩy thay đổi danh mục lên Sheet).</div>`:`<div class="notice">Bạn đang <b>xem</b> danh mục dùng chung của công ty: đầu mục việc, khoản mục, đối tượng, đơn vị và danh sách quỹ. Chỉ <b>Admin / Kế toán</b> mới chỉnh sửa được.</div>`;
  const scopeLabel={all:'Mọi khoản chi',khoanMuc:'Khoản mục',dauMuc:'Đầu mục',doiTuong:'Đối tượng',site:'Quỹ'};
  const ruleActs=i=>canEd?`<button class="iconbtn" onclick="ruleForm(${i})">✏️</button><button class="iconbtn" onclick="rmRule(${i})">🗑️</button>`:'';
  const ruleRows=(DB.rules||[]).map((r,i)=>`<tr><td>${esc(r.label||'')}</td><td>${scopeLabel[r.applyTo]||r.applyTo}${r.match?(': '+esc(r.match)):''}</td><td class="num">${(r.cmp==='>'?'> ':'≥ ')+fmt(r.limit)}</td><td>${r.mode==='block'?'<span class="tag" style="background:#C00000">Chặn</span>':'<span class="tag" style="background:#b8860b">Cảnh báo</span>'}</td><td>${ruleActs(i)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Chưa có ngưỡng nào</td></tr>';
  const addRule=canEd?`<button class="btn sm" style="margin-left:auto" onclick="ruleForm(-1)">+ Thêm ngưỡng</button>`:'';
  const ruleCard=`<div class="fcard" style="margin-top:12px"><div style="display:flex;align-items:center;gap:8px"><b style="color:#1F4E79">⚠️ Ngưỡng cảnh báo chi (quy định thuế / nội bộ)</b>${addRule}</div><div class="muted" style="margin:4px 0 8px">Khi nhập phiếu <b>CHI</b> vượt ngưỡng, app sẽ cảnh báo (hoặc chặn) người nhập. Admin/Kế toán đặt ngưỡng tại đây.</div><div class="tbl-wrap" style="max-height:none;margin-top:4px"><table><thead><tr><th>Nội dung</th><th>Áp dụng</th><th class="num">Ngưỡng</th><th>Mức độ</th><th></th></tr></thead><tbody>${ruleRows}</tbody></table></div></div>`;
  document.getElementById('view').innerHTML=`${notice}<div class="fcard"><div style="display:flex;align-items:center"><b style="color:#1F4E79">Công trường / Văn phòng</b>${addSite}</div><div class="tbl-wrap" style="margin-top:8px;max-height:none"><table><thead><tr><th>Loại</th><th>Mã</th><th>Tên</th><th class="num">Tồn đầu kỳ</th><th></th></tr></thead><tbody>${siteRows}</tbody></table></div></div><div class="cat4">${block('Đầu mục việc','dauMuc')}${block('Khoản mục chi','khoanMuc')}${block('Đối tượng chi','doiTuong')}${block('Đơn vị / Nguồn quỹ','donVi')}</div>${ruleCard}`;
}
function listForm(key,title,i){
  const editing=(i!=null&&i>=0);
  openForm({title:(editing?'Sửa ':'Thêm ')+title.toLowerCase(),fields:[{key:'val',label:title,value:editing?DB[key][i]:'',placeholder:'Nhập '+title.toLowerCase()}],saveLabel:editing?'Lưu thay đổi':'Thêm',onSave:async v=>{if(!v.val){alert('Chưa nhập nội dung');return;}if(editing)DB[key][i]=v.val;else DB[key].push(v.val);await saveDB();closeModal();renderMaster();}});
}
async function rmItem(k,i){if(confirm('Xóa "'+DB[k][i]+'"?')){DB[k].splice(i,1);await saveDB();renderMaster();}}
function nextSiteCode(){let mx=0;DB.sites.forEach(s=>{const m=/^CT(\d+)$/.exec(s.code);if(m)mx=Math.max(mx,+m[1]);});return 'CT'+String(mx+1).padStart(2,'0');}
function siteForm(i){
  const editing=i>=0; const s=editing?DB.sites[i]:{code:nextSiteCode(),name:'',type:'ct'};
  openForm({title:editing?('Sửa quỹ — '+s.code):'Thêm quỹ mới',subtitle:'Điền mã quỹ, tên và loại. Mã dùng để phân quyền tài khoản công trường & ký hiệu số phiếu.',fields:[{key:'code',label:'Mã quỹ (tự động điền, sửa được)',value:s.code,placeholder:'VD: CT03, VP'},{key:'name',label:'Tên quỹ / công trường',value:s.name,placeholder:'VD: Công trường 03 - Dự án ...'},{key:'type',label:'Loại quỹ',type:'select',value:s.type,options:[{v:'ct',l:'Công trường'},{v:'vp',l:'Văn phòng'}]},{key:'opening',label:'Tồn quỹ đầu kỳ (VNĐ)',value:DB.opening[s.code]||0,money:true}],saveLabel:editing?'Lưu thay đổi':'Thêm quỹ',
    onSave:async v=>{const code=(v.code||'').toUpperCase();if(!code){alert('Chưa nhập mã quỹ');return;}if(editing){const old=s.code;Object.assign(s,{code,name:v.name,type:v.type});if(old!==code){DB.txns.forEach(t=>{if(t.site===old)t.site=code;});delete DB.opening[old];}DB.opening[code]=v.opening;}else{if(DB.sites.some(x=>x.code===code)){alert('Mã quỹ đã tồn tại');return;}DB.sites.push({code,name:v.name,type:v.type});DB.opening[code]=v.opening;}await saveDB();closeModal();renderMaster();}});
}
async function rmSite(i){const s=DB.sites[i];if(DB.txns.some(t=>t.site===s.code)){alert('Quỹ này đang có giao dịch, không thể xóa.');return;}if(confirm('Xóa quỹ '+s.name+'?')){DB.sites.splice(i,1);delete DB.opening[s.code];await saveDB();renderMaster();}}

function renderUsers(){
  const isKt=ME.role==='ketoan';
  const rows=DB.users.map((u,i)=>{
    if(isKt&&(u.role==='admin'||u.role==='ketoan'))return '';
    const delBtn=u.u==='admin'?'':`<button class="iconbtn" onclick="rmUser(${i})">🗑️</button>`;
    return `<tr><td>${esc(u.u)}</td><td>${esc(u.name)}</td><td>${roleLabel(u.role)}</td><td>${esc(deptName(u))}</td><td><button class="iconbtn" onclick="userForm(${i})">✏️</button>${delBtn}</td></tr>`;
  }).join('');
  const notice=isKt
    ?`<div class="notice"><b>Quyền Kế toán:</b> chỉ được <b>thêm và quản lý tài khoản Công trình / Văn phòng</b>. Không xem và không sửa được tài khoản Admin (và cấp Kế toán). Tài khoản tạo ở đây lưu vào sheet <b>Users</b> trên Google Sheet để đăng nhập trên mọi máy.</div>`
    :`<div class="notice"><b>Phân quyền:</b> <b>Admin</b> – toàn quyền, sửa mọi thứ + cập nhật link URL. <b>Kế toán</b> – xem & sửa số liệu công ty/công trình/văn phòng, chỉ thêm được tài khoản Công trình/Văn phòng, không đụng tới tài khoản Admin & link URL. <b>Công trình / Văn phòng</b> – làm việc trên bộ phận được giao (Tổng quan · Sổ quỹ · Báo cáo) và xem Danh mục.</div>`;
  const urlCard=isAdmin()?`<div class="fcard" style="margin-top:12px"><b style="color:#1F4E79">Cài đặt đồng bộ Google Sheet (chỉ Admin)</b><label>Địa chỉ Web App (URL Apps Script kết thúc bằng /exec)</label><input id="syncUrlIn" value="${esc(DB.syncUrl||'')}" placeholder="https://script.google.com/macros/s/.../exec"><div style="display:flex;gap:8px;margin-top:10px"><button class="btn sm" onclick="saveSyncUrl()">Lưu địa chỉ</button><button class="btn sm gray" onclick="cloudPull(true)">⬇ Tải từ Sheet</button><button class="btn sm gray" onclick="syncNow()">⬆ Đẩy & đồng bộ</button><button class="btn sm alt" onclick="testAppTxt(this)">🔎 Kiểm tra app.txt</button></div><div class="muted" style="margin-top:8px">Dữ liệu lưu ngay trên máy; mỗi 1 phút tự đồng bộ 2 chiều với Google Sheet. Ảnh chứng từ lưu trên máy người nhập và tự tải lên Google Drive (cùng thư mục Google Sheet), tên file theo bản ghi; máy khác sẽ tự lấy ảnh từ Drive khi cần.</div></div>`:`<div class="fcard" style="margin-top:12px"><div class="muted">Đồng bộ Google Sheet đang bật. Việc cập nhật địa chỉ liên kết (URL Apps Script) chỉ Admin thực hiện được.</div></div>`;
  document.getElementById('view').innerHTML=`${notice}<div class="fcard"><div style="display:flex;align-items:center"><b style="color:#1F4E79">Tài khoản đăng nhập</b><button class="btn sm" style="margin-left:auto" onclick="userForm(-1)">+ Thêm tài khoản</button></div><div class="tbl-wrap" style="margin-top:8px;max-height:none"><table><thead><tr><th>Tài khoản</th><th>Tên</th><th>Quyền</th><th>Bộ phận quản lý</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>${urlCard}`;
}
async function saveSyncUrl(){DB.syncUrl=document.getElementById('syncUrlIn').value.trim();await Store.set(KEY,JSON.stringify(DB));updateSyncBadge();alert('Đã lưu địa chỉ đồng bộ. Bấm "Tải từ Sheet" để lấy dữ liệu dùng chung.');}
async function testAppTxt(btn){
  const old=btn?btn.textContent:''; if(btn){btn.textContent='Đang kiểm tra…';btn.disabled=true;}
  let u='';
  try{ u=await fetchSyncUrlFromFile(); }catch(e){}
  if(btn){btn.textContent=old;btn.disabled=false;}
  if(u){
    if(u!==DB.syncUrl){DB.syncUrl=u;try{await Store.set(KEY,JSON.stringify(DB));}catch(e){}updateSyncBadge();const inp=document.getElementById('syncUrlIn');if(inp)inp.value=u;}
    alert('✅ ĐỌC ĐƯỢC app.txt.\nURL lấy được:\n'+u+'\n\n'+('Đã đặt làm URL đồng bộ hiện tại.'));
  }else{

        if(role==='congtrinh'&&sObj.type!=='ct'){alert('Tài khoản Công trình phải gán cho một Công trường');return;}
        if(role==='vanphong'&&sObj.type!=='vp'){alert('Tài khoản Văn phòng phải gán cho một Văn phòng');return;}
      }
      const un=lockAdmin?u.u:v.u.toLowerCase();
      const obj={u:un,p:v.p,name:v.name,role,site};
      if(editing)Object.assign(DB.users[i],obj);else{if(DB.users.some(x=>x.u===obj.u)){alert('Tên đăng nhập đã tồn tại');return;}DB.users.push(obj);}

/* ===== ĐỌC SỐ TIỀN BẰNG CHỮ ===== */
function docTienBangChu(soTien){
  soTien=Math.round(Number(soTien)||0);
  if(soTien===0)return 'Không đồng';
  const CS=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  const DV=['','nghìn','triệu','tỷ','nghìn tỷ','triệu tỷ'];
  function doc3(b,dayDu){
    let tr=Math.floor(b/100),ch=Math.floor((b%100)/10),dv=b%10,r='';
    if(b===0)return '';
    if(dayDu||tr>0){r+=CS[tr]+' trăm';if(ch===0&&dv>0)r+=' linh';}
    if(ch===1)r+=' mười'; else if(ch>1)r+=' '+CS[ch]+' mươi';
    if(dv>0){ if(ch>1&&dv===1)r+=' mốt'; else if(ch>=1&&dv===5)r+=' lăm'; else r+=' '+CS[dv]; }
    return r.trim();
  }
  let so=String(soTien); while(so.length%3!==0)so='0'+so;
  let g=[]; for(let i=0;i<so.length;i+=3)g.push(parseInt(so.substr(i,3),10));
  let n=g.length,res='';
  for(let i=0;i<n;i++){ if(g[i]===0)continue; let u=n-1-i; res+=(res?' ':'')+doc3(g[i],i>0)+(DV[u]?' '+DV[u]:''); }
  res=(res.replace(/\s+/g,' ').trim()+' đồng');
  return res.charAt(0).toUpperCase()+res.slice(1);
}

let deferredPrompt=null;
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function isStandalone(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}

function hideInstallBtn(){const b=document.getElementById('installBtn');if(b)b.style.display='none';}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!isStandalone())showInstallBtn();});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;hideInstallBtn();});
async function doInstall(){
  if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;hideInstallBtn();return;}
  if(isIOS()){iosInstallGuide();return;}
  alert('Để cài đặt: mở menu trình duyệt (⋮ hoặc ⋯) và chọn "Cài đặt ứng dụng" / "Thêm vào màn hình chính". Nếu không thấy, hãy mở app qua đường dẫn https (đã đưa lên mạng).');

/* ===== CỠ CHỮ (Nhỏ / Vừa / To) ===== */
const FS_ORDER=['md','lg','sm']; const FS_LABEL={sm:'A Nhỏ',md:'A Vừa',lg:'A To'};
function applyFontSize(v){
  if(!FS_LABEL[v])v='md';
  try{document.documentElement.setAttribute('data-fs',v);}catch(e){}
  try{localStorage.setItem('tapaco_fs',v);}catch(e){}
  const b=document.getElementById('fsBtn'); if(b)b.textContent=FS_LABEL[v];
}
function cycleFontSize(){
  let cur='md'; try{cur=localStorage.getItem('tapaco_fs')||'md';}catch(e){}
  const i=FS_ORDER.indexOf(cur); applyFontSize(FS_ORDER[(i<0?0:i+1)%FS_ORDER.length]);
}
function initFontSize(){ let v='md'; try{v=localStorage.getItem('tapaco_fs')||'md';}catch(e){} applyFontSize(v); }
initFontSize();
